    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <script>
      const RYBBIT_PRODUCTION_HOST = 'mychip.vercel.app';
      if (window.location.hostname === RYBBIT_PRODUCTION_HOST) {
        const analyticsScript = document.createElement('script');
        analyticsScript.src = 'https://app.rybbit.io/api/script.js';
        analyticsScript.dataset.siteId = '6ec9b20406aa';
        analyticsScript.defer = true;
        document.head.append(analyticsScript);
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>

    <main id="app"></main>
    <script src="./remote-config.js"></script>
